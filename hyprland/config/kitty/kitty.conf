# kitty for the YunYun Syndrome session (found through KITTY_CONFIG_DIRECTORY,
# so your own ~/.config/kitty is untouched)

include yunyun-colors.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

# Starts your usual shell with the YunYun prompt, without editing your shell's rc files
shell yunyun-shell

window_padding_width 25
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.88
cursor_shape block
cursor_trail 1
cursor_blink_interval 0.6
enable_audio_bell no

tab_bar_style powerline
tab_powerline_style slanted
