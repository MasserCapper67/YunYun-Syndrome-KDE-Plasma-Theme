; cava settings for the panel visualizer: raw ascii output, one line per frame,
; values 0-6 (the number of dot rows), separated by ';'

[general]
bars = 44
framerate = 30
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 6
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
